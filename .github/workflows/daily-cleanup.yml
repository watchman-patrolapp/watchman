name: Daily Location Cleanup

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Trigger Location Cleanup Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "SUPABASE_URL and CRON_SECRET secrets are required"
            exit 1
          fi

          echo "=== Triggering Edge Function ==="
          echo "URL: ${SUPABASE_URL}/functions/v1/location-cleanup"

          HEADERS=(-H "Content-Type: application/json" -H "x-cron-secret: ${CRON_SECRET}")
          # Gateway often expects an apikey header; use the anon key only (never the service role).
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            HEADERS+=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/location-cleanup" \
            "${HEADERS[@]}" \
            -d '{"trigger": "scheduled-cleanup"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Cleanup triggered successfully"
            exit 0
          else
            echo "Failed with status $HTTP_CODE"
            exit 1
          fi
